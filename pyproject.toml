[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sajen-stem-projects"
version = "0.1.0"
description = "Reconstructed stock, exercise-form, and keratoconus analysis projects"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26,<3", "pandas>=2,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
stock = ["tensorflow>=2.16,<3"]
vision = ["mediapipe>=0.10.30,<0.11", "opencv-contrib-python>=4.8,<5"]

[tool.setuptools.packages.find]
where = ["src"]

